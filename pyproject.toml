[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filmunet-hairline"
version = "0.1.0"
description = "GSD-conditioned (FiLM) U-Net segmentation of thin and faint concrete cracks"
requires-python = ">=3.11"
dependencies = ["torch>=2.9", "torchvision>=0.24", "numpy", "opencv-python-headless", "pillow", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
